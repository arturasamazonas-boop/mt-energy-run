# Render Blueprint: web service. The database lives on Neon (free, never expires);
# its connection string is entered in the Render dashboard. Secrets are never
# committed. See README.md → "Paleidimas Render'yje".
services:
  - type: web
    name: mt-energy-run
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Neon connection string (…?sslmode=require), set by hand in Environment
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: BIRTHDAY_MODE
        value: auto
      - key: ACCOUNT_SECRET
        generateValue: true
      # Email protection (same Resend setup as Penktas Gurkšnis). Fill in the dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: ACCOUNT_EMAIL_FROM
        sync: false

