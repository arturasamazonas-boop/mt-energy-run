# Render Blueprint: web service + PostgreSQL. Secrets are generated by Render,
# never committed. See README.md → "Paleidimas Render'yje".
services:
  - type: web
    name: mt-energy-run
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mt-energy-run-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: BIRTHDAY_MODE
        value: auto

databases:
  - name: mt-energy-run-db
    databaseName: mt_energy_run
    # Render's free PostgreSQL expires after 30 days. For a longer-lived company
    # leaderboard switch to a paid plan (e.g. basic-256mb) in the Render dashboard.
    plan: free
